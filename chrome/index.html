<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continue Chat (Chrome)</title>
    <style>
        html,
        body,
        #root {
            height: 100%;
            margin: 0;
            background: #0b0f1a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f5f6f7;
        }

        #root {
            isolation: isolate;
        }
    </style>
</head>

<body>
    <div id="root">
        <noscript>Enable JavaScript to load the Continue chat panel.</noscript>
    </div>
    <script>
        (function setupContinueGlobals() {
            const icon = document.createElement("link");
            icon.rel = "icon";
            icon.type = "image/png";
            icon.href = new URL("play_button.png", window.location.href).toString();
            document.head.appendChild(icon);

            if (!window.vscode) {
                window.vscode = {
                    postMessage(message) {
                        console.debug("[chrome shim] Dropped VS Code webview message", message);
                    },
                };
            }

            let errorShown = false;
            window.__continueBootstrapError = function (message) {
                if (errorShown) return;
                errorShown = true;
                const notice = document.createElement("div");
                notice.style.cssText = "font-family:monospace;padding:1rem;background:#1e1e1e;color:#f87171";
                notice.innerHTML = `${message}<br/>Did you run <code>npm run dev</code> inside <code>gui/</code>?`;
                document.body.appendChild(notice);
            };
        })();
    </script>
    <link rel="stylesheet" href="http://localhost:5173/src/index.css"
        onerror="window.__continueBootstrapError('Failed to load GUI dev stylesheet.')">
    <script type="module" onerror="window.__continueBootstrapError('Failed to install React refresh preamble.')">
        import RefreshRuntime from "http://localhost:5173/@react-refresh";
        RefreshRuntime.injectIntoGlobalHook(window);
        window.$RefreshReg$ = () => { };
        window.$RefreshSig$ = () => (type) => type;
        window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="http://localhost:5173/@vite/client"
        onerror="window.__continueBootstrapError('Failed to load Vite client script.')"></script>
    <script type="module" src="http://localhost:5173/src/main.tsx"
        onerror="window.__continueBootstrapError('Failed to load GUI entrypoint.')"></script>
</body>

</html>
